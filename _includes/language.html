{% assign languages = site.data.data.sidebar.languages %}
{% if languages %}
<section class="section languages-section">

  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-language fa-stack-1x fa-inverse"></i>
    </span>
    {{ languages.title }}
  </h2>

  {% for language in languages.info %}
  <div class="item">
    <div class="meta">
      <div class="upper-row">
        <h3 class="language-name">{{ language.idiom }}</h3>
        <div class="time">{{ language.level }}</div>
      </div><!--//upper-row-->
    </div><!--//meta-->

    <hr/>
  </div><!--//item-->
  {% endfor %}

</section><!--//section-->
{% endif %}
